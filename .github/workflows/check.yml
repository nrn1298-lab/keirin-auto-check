name: Keirin Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python program
        run: python -m py_compile keirin_filter.py scan_today.py send_email.py

      - name: Test race filtering
        run: python keirin_filter.py test_races.csv

      - name: Test real race page
        run: python probe_source.py

      - name: Check actual race conditions
        run: python keirin_filter.py --live https://www.keibure.com/42/20261101/1

      - name: Scan today's races
        id: scan
        continue-on-error: true
        run: python scan_today.py > scan_result.txt 2>&1

      - name: Email scan results
        if: always() && steps.scan.outcome != 'skipped'
        env:
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
        run: |
          if grep -q '^========== RESULTS ==========$' scan_result.txt; then
            sed -n '/^========== RESULTS ==========$/,$p' scan_result.txt > email_result.txt
          else
            echo "競輪チェック失敗：結果を取得できませんでした。" > email_result.txt
          fi
          if grep -qE 'FETCH ERROR|INDEX WARNING|Traceback|RuntimeError|INCOMPLETE SCAN' scan_result.txt; then
            printf '\n========== ERROR DETAILS ==========\n' >> email_result.txt
            grep -E 'FETCH ERROR|INDEX WARNING|Traceback|RuntimeError|INCOMPLETE SCAN' scan_result.txt >> email_result.txt || true
          fi
          python send_email.py < email_result.txt

      - name: Fail if scan was incomplete
        if: steps.scan.outcome == 'failure'
        run: exit 1
